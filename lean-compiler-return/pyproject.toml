[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lean_backtest_tool"
version = "0.1.0"
description = "Single-responsibility tool: runs one pinned-LEAN backtest in Docker, returns a filtered deterministic log string."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]
ui = [
    # Tkinter ships with the stdlib on Windows Python; no extra deps required.
]

[tool.setuptools.packages.find]
where = ["."]
include = ["lean_backtest_tool*"]
