ing logic:**\nSince the next day’s closing price is unknown, the current closing price of day N is used to forecast EMA(N+1). The formula for the forecast EMA will look like this:\n`EMA_forecast(N+1) = (Close(N) * k) + (EMA(N) * (1 - k))`\nWhere:\n*   `Close(N)` — the closing price of the current day.\n*   `EMA(N)` — the EMA value calculated at the end of the current day.\n*   `k` — the weighting multiplier.\n\n**Conditions for entering a position:**\n*   **Opening a long position (Buy):** When the current day’s closing price `Close(N)` is significantly **below** the forecast EMA for the next day `EMA_forecast(N+1)`. This is interpreted as a buy signal, since the price is likely to correct upward toward its mean value.\n    *   **Threshold value:** The difference between `Close(N)` and `EMA_forecast(N+1)` must be at least 0.5%.\n*   **Opening a short position (Sell):** When the current day’s closing price `Close(N)` is significantly **above** the forecast EMA for the next day `EMA_forecast(N+1)`. This is interpreted as a sell signal, since the price is likely to correct downward toward its mean value.\n    *   **Threshold value:** The difference between `Close(N)` and `EMA_forecast(N+1)` must be at least 0.5%.\n\n**Conditions for exiting a position:**\n*   **Closing a long position (Sell):** When the next day’s closing price crosses the forecast EMA (`EMA_forecast(N+1)`) from above to below.\n*   **Closing a short position (Buy):** When the next day’s closing price crosses the forecast EMA (`EMA_forecast(N+1)`) from below to above.\n\n**Risk management and position sizing:**\n*   **Stop-loss for a long position:** Set at 2% below the entry price.\n*   **Stop-loss for a short position:** Set at 2% above the entry price.\n*   **Take-profit for a long position:** Set at 3% above the entry price.\n*   **Take-profit for a short position:** Set at 3% below the entry price.\n*   **Position size:** Fixed, for example, 100% of available capital per trade.\n\n**Additional rules:**\n*   The strategy must be tested on the daily timeframe (D1).\n*   To filter false signals, an additional condition can be added: trades are allowed only in the direction of the main trend, determined by EMA(50). For example, to open a long position, EMA(50) must be trending upward.", "screen": {"rubric": {"pinned_entry": false, "pinned_exit": false, "pinned_indicator_params": true, "pinned_sizing": false, "binding_coherent": true, "timeframe_coherent": true, "goal_directed": false, "external_data_required": false, "multi_asset_required": false, "hardcoded_prices_meaningful": true}, "predicted_class": "INDETERMINATE", "predicted_ambiguity_classes": ["unpinned-entry-trigger", "unpinned-exit", "unpinned-sizing"]}, "final": {"verdict": "INDETERMINATE", "ambiguity_classes": [], "summary": null}}, {"id": 113, "difficulty": "hard", "source": "stackexchange", "ticker": "generic", "yf_symbol": "AAPL", "timeframe": "1d", "prompt": "**Assignment for writing a trading strategy with costs taken into account**\n\n**Strategy name/description and main idea:**\nCreate a trading strategy based on portfolio optimization with costs taken into account. The main idea is not just to maximize return, but to find an optimal balance between expected return, risk (volatility), and real trading costs, including market impact and transaction costs.\n\n**Which indicators to use:**\n*   **Expected return (r):** Use a vector of expected asset returns over the reinvestment period (for example, T=1 year). These values can be calculated based on historical returns or a factor model.\n*   **Risk covariance matrix (Σ):** Calculate the covariance matrix based on historical asset return data over the same period. To improve accuracy, you can use a factor model, where Σ = XᵀFX + D, where X is the matrix of factor loadings, F is the factor covariance matrix, and D is the diagonal matrix of specific risks.\n*   **Impact costs (Θ):** Introduce into the model costs proportional to the size of trading volume raised to the power of 3/2. This reflects the empirical fact that market impact grows faster than trading volume.\n\n**Conditions for entering a position (when to buy/sell):**\nOpen or revise the portfolio by solving the following optimization problem at each iteration:\nFind the optimal asset weights `w*` that maximize the expression:\n`(r - I(t))ᵀw - λwᵀΣw - Θ|w|^(3/2)`\n\nwhere:\n*   `w` — vector of target asset weights in the portfolio.\n*   `r` — vector of expected returns.\n*   `I(t)` — vector of impact costs, where `t = |w - w₀|` — this is the trading volume (the difference between the target and current portfolio weights).\n*   `λ` — risk coefficient (risk aversion) that determines the importance of risk compared to return.\n*   `Σ` — risk covariance matrix.\n*   `Θ` — coefficient that scales market impact costs.\n\n**Conditions for exiting a position (when to close):**\n*   **Rebalancing:** Close current positions and open new ones in accordance with the new target weights `w*` calculated at each step (for example, daily or weekly).\n*   **Dynamic rebalancing:** The model itself determines the need to trade via the term `|w - w₀|^(3/2)`. If the cost of reaching the new optimal portfolio (including costs) exceeds the potential benefit, the strategy will not initiate trading.\n\n**Risk management and position sizing:**\n*   **Constraints:** Introduce linear constraints on the portfolio in the form `l_b ≤ Aw ≤ u_b`, where `A` is the constraint matrix, and `l_b` and `u_b` are vectors of lower and upper bounds. Examples of constraints:\n    *   `l_b = u_b = w₀` (full investment constraint).\n    *   Constraints on the maximum weight for a single asset (for example, no more than 10%).\n    *   Constraints on sector exposure.\n    *   Constraints on portfolio turnover (turnover constraints).\n*   **Risk coefficient (λ):** Use this parameter to control between aggressive (high return, high risk) and conservative (low return, low risk) trading.\n\n**Any additional rules or filters:**\n*   **Liquidity filters:** Exclude from consideration or assign low target weights to assets with insufficient liquidity, since for", "screen": {"rubric": {"pinned_entry": false, "pinned_exit": false, "pinned_indicator_params": false, "pinned_sizing": false, "binding_coherent": true, "timeframe_coherent": true, "goal_directed": false, "external_data_required": true, "multi_asset_required": true, "hardcoded_prices_meaningful": true}, "predicted_class": "INDETERMINATE", "predicted_ambiguity_classes": ["multi-asset-required", "external-data-required", "unpinned-indicator-params", "unpinned-entry-trigger", "unpinned-exit", "unpinned-sizing", "other"]}, "final": {"verdict": "INDETERMINATE", "ambiguity_classes": ["multi-asset-required", "external-data-required", "unpinned-indicator-params", "unpinned-entry-trigger", "unpinned-exit", "unpinned-sizing", "other"], "summary": null}}, {"id": 129, "difficulty": "easy", "source": "reddit", "ticker": "generic", "yf_symbol": "AAPL", "timeframe": "1h", "prompt": "**Trading Strategy: Falling Channel Breakout**\n\n**Strategy Description:**\nDevelop a trading strategy that identifies and trades breakouts from a falling price channel. The strategy should detect a bearish channel structure on the chart and enter a long position when the price breaks above the upper channel boundary, anticipating a reversal to the upside.\n\n**Indicators:**\n- Use Bollinger Bands (BB) with a period of 20 and standard deviation of 2 to define the channel boundaries. The middle band will serve as the channel's midline, and the upper/lower bands will act as the resistance/support levels of the channel.\n- Alternatively, use a Donchian Channel with a period of 20, where the upper band is the highest high and the lower band is the lowest low over the last 20 periods.\n\n**Entry Conditions:**\n- **Long Entry:** Enter a long position when the price closes above the upper band of the falling channel (either the Bollinger Bands upper line or the Donchian Channel high). This confirms a bullish breakout.\n- Ensure the channel has been established with at least 3 consecutive lower highs and lower lows to confirm the falling structure before considering a breakout.\n\n**Exit Conditions:**\n- **Take Profit:** Set the take profit target at a distance equal to the height of the channel (the difference between the upper and lower bands at the time of the breakout). For example, if the channel height is 5%, the take profit will be 5% above the entry price.\n- **Stop Loss:** Place a stop loss order below the lower band of the channel (the Bollinger Bands lower line or the Donchian Channel low). This protects against a false breakout and a continuation of the downtrend.\n\n**Risk Management:**\n- The position size should be calculated based on a fixed risk percentage of the account equity (e.g., 1% or 2% per trade). The risk is defined as the distance between the entry price and the stop loss.\n- Do not enter a new trade if the current drawdown exceeds a certain threshold (e.g., 10% of the account balance).\n\n**Additional Rules:**\n- **Timeframe:** The strategy is designed to be run on the 4-hour (H4) chart.\n- **Filter:** To avoid false breakouts, require that the breakout is accompanied by a spike in trading volume, which is higher than the average volume of the last 10 periods. If volume data is not available, this filter can be ignored.", "screen": {"rubric": {"pinned_entry": false, "pinned_exit": false, "pinned_indicator_params": true, "pinned_sizing": false, "binding_coherent": true, "timeframe_coherent": false, "goal_directed": false, "external_data_required": false, "multi_asset_required": false, "hardcoded_prices_meaningful": true}, "predicted_class": "INDETERMINATE", "predicted_ambiguity_classes": ["unpinned-entry-trigger", "unpinned-exit", "unpinned-sizing", "timeframe-mismatch"]}, "final": {"verdict": "INDETERMINATE", "ambiguity_classes": [], "summary": null}}, {"id": 131, "difficulty": "easy", "source": "reddit", "ticker": "ES", "yf_symbol": "ES=F", "timeframe": "1h", "prompt": "**Trading Strategy Writing Assignment:**\n\n**Strategy Name:** \"NVDA Pre-Earnings Momentum Breakout\"\n\n**Core Idea:** The strategy is aimed at trading the upside in the E-mini S&P 500 (ES) ahead of NVDA’s earnings release, based on an analysis of price patterns and support/resistance levels. The strategy assumes that if the market maintains confidence going into NVDA’s earnings (as seen by NVDA’s stock price rising toward its all-time highs), then the ES index will continue its upward move.\n\n**Indicators and Parameters:**\n1.  **Support and resistance levels:** Defined based on price extremes.\n    *   Nearest support: 6455 - 6465.\n    *   Key support (50% retracement): 6430.75.\n    *   Resistance (previous high): 6496.25.\n    *   Target (new ATH): 6508.75.\n2.  **Trend indicator (optional for confirmation):** 200-period simple moving average (SMA) on the daily timeframe to determine the global trend.\n3.  **Indicator for NVDA (optional filter):** Analysis of NVDA’s stock price for being at all-time highs (ATH) in the 183-185 range.\n\n**Conditions for entering a long position (buy):**\n1.  The ES index price must be above or within the nearest support zone (6455-6465).\n2.  A pullback from the key support at 6430.75 has occurred, and the price has started to recover.\n3.  The ES price breaks above the resistance level 6496.25 (the last high) with increased volume.\n4.  *(Optional filter)* NVDA’s stock price is near or testing its all-time highs (ATH) in the 183-185 range.\n\n**Conditions for exiting the position:**\n1.  **Take-profit:** Upon reaching the target level 6508.75 (new all-time high).\n2.  **Stop-loss:** If the price drops below the nearest support zone 6455-6465. The stop-loss can be placed at the lower boundary of the zone, for example, at 6455.\n3.  *(Alternative exit)* If signs of a reversal downward appear (for example, formation of a bearish candlestick pattern on increased volume).\n\n**Risk management and position sizing:**\n1.  The position size must be such that the potential loss at the stop-loss does not exceed 1-2% of total trading capital.\n2.  The risk per trade (the stop-loss size in points multiplied by the lot size) must be fixed and must not exceed the established limit.\n\n**Additional rules and filters:**\n1.  The strategy is intended for trading on timeframes from 4 hours and higher.\n2.  Trades are not executed during the release of major news (such as NVDA earnings) to avoid high volatility and gaps.\n3.  Entry is recommended to be confirmed by rising trading volume at the moment of the breakout above the resistance level 6496.25.", "screen": {"rubric": {"pinned_entry": false, "pinned_exit": false, "pinned_indicator_params": false, "pinned_sizing": false, "binding_coherent": true, "timeframe_coherent": false, "goal_directed": false, "external_data_required": true, "multi_asset_required": false, "hardcoded_prices_meaningful": true}, "predicted_class": "INDETERMINATE", "predicted_ambiguity_classes": ["unpinned-entry-trigger", "unpinned-exit", "unpinned-sizing", "unpinned-indicator-params", "timeframe-mismatch", "external-data-required"]}, "final": {"verdict": "INDETERMINATE", "ambiguity_classes": ["unpinned-entry-trigger", "unpinned-exit", "unpinned-indicator-params", "unpinned-sizing", "external-data-required", "timeframe-mismatch"], "summary": null}}, {"id": 136, "difficulty": "easy", "source": "reddit", "ticker": "NVDA", "yf_symbol": "NVDA", "timeframe": "1d", "prompt": "**Trading Strategy Development Assignment**\n\n**Strategy name/description and main idea:**\nCreate a trading strategy for NVDA shares based on a breakout of a key resistance level with subsequent pricing in the direction of the trend. The strategy uses an Exponential Moving Average (EMA) for risk management via a trailing stop.\n\n**Indicators:**\n- Exponential Moving Average (EMA) with a period of 8.\n\n**Conditions for entering a position (buy):**\nOpen a long position if the closing price of the current bar exceeds the level 179.33.\n\n**Conditions for exiting a position (sell):**\n1.  **Take-profit:** Close 50% of the position upon reaching the price 184.89.\n2.  **Final take-profit:** Close the remaining part of the position upon reaching the price 192.95.\n3.  **Trailing stop:** For risk management, use a trailing stop that follows the price, lagging by a distance equal to the value of the 8-period EMA. This means that the stop-loss will automatically move upward as the price rises, but will not fall below its previous value.\n\n**Risk and position size management:**\nRisk per trade must not exceed 2% of total trading capital. Position size is calculated so that the potential loss from the stop-loss does not exceed this limit.\n\n**Additional rules:**\nThe strategy is intended to operate on the D1 (daily) timeframe.", "screen": {"rubric": {"pinned_entry": true, "pinned_exit": false, "pinned_indicator_params": true, "pinned_sizing": true, "binding_coherent": true, "timeframe_coherent": true, "goal_directed": false, "external_data_required": false, "multi_asset_required": false, "hardcoded_prices_meaningful": true}, "predicted_class": "INDETERMINATE", "predicted_ambiguity_classes": ["unpinned-exit"]}, "final": {"verdict": "INDETERMINATE", "ambiguity_classes": ["unpinned-exit", "unpinned-sizing"], "summary": null}}, {"id": 146, "difficulty": "easy", "source": "reddit", "ticker": "generic", "yf_symbol": "AAPL", "timeframe": "1d", "prompt": "**Trading Strategy Writing Assignment:**\n\nWrite a trading strategy based on the \"Cup and Handle\" pattern. The strategy must identify this pattern on the chart and trade its breakout.\n\n**Main Idea:**\nLook for the formation of the \"Cup and Handle\" pattern on a timeframe of 1 year or higher. After the pattern formation is complete, enter a long position on a breakout of its upper boundary with volume confirmation.\n\n**Indicators:**\n- Use only price data (OHLC) to identify the pattern.\n- Use a volume indicator to confirm the breakout.\n\n**Entry Conditions (Buy):**\n1.  The \"Cup and Handle\" pattern must be fully formed. The cup is a U-shaped formation, and the handle is a consolidation or a small decline after the bottom of the cup.\n2.  Price must break upward above the resistance level corresponding to the upper boundary of the cup (the pattern neckline).\n3.  The breakout must be confirmed by increased volume. Volume on the breakout candle must be above the average volume over the last 50 candles (or another reasonable period to determine average volume).\n4.  **Preferably**, the closing price of the breakout candle should be above the resistance level.\n\n**Exit Conditions (Sell):**\n- Close the position when price drops below the lowest point of the handle of the pattern (this will be the default stop-loss).\n\n**Risk Management and Position Sizing:**\n- Position size must be calculated based on the stop-loss. Risk per trade must not exceed 1-2% of total capital.\n- The default stop-loss is set at the level of the handle low.\n\n**Additional Rules or Filters:**\n- The formation time of the \"Cup and Handle\" pattern must be at least 1 year (for example, on a daily chart this would be about 250 candles).\n- The strategy must be designed for trading long positions (long only).", "screen": {"rubric": {"pinned_entry": false, "pinned_exit": false, "pinned_indicator_params": false, "pinned_sizing": false, "binding_coherent": true, "timeframe_coherent": true, "goal_directed": false, "external_data_required": false, "multi_asset_required": false, "hardcoded_prices_meaningful": true}, "predicted_class": "INDETERMINATE", "predicted_ambiguity_classes": ["unpinned-entry-trigger", "unpinned-indicator-params", "unpinned-sizing", "unpinned-exit"]}, "final": {"verdict": "INDETERMINATE", "ambiguity_classes": [], "summary": null}}, {"id": 172, "difficulty": "hard", "source": "reddit", "ticker": "SPT", "yf_symbol": "SPT", "timeframe": "1h", "prompt": "SPT — RSI Bullish Divergence + Breakout with Volume Confirmation (4H). Long entry: (1) on the 4-hour chart, an RSI(14) bullish divergence forms: price makes a lower low relative to the previous local low, while RSI makes a higher low; (2) then a resistance breakout occurs: a close above the high of the last 20 bars; (3) the current bar’s volume is above average — volume > SMA(volume, 20). Exit: stop-loss 2% below the entry price; take-profit 6% above; alternative exit — on RSI bearish divergence (price makes a higher high, RSI makes a lower high) or a close below the low of the last 10 bars after entry. Risk management: risk 1% of capital per trade; position size = 1% of capital / (0.02 * entry price). Time filter: signals are accepted only in November–December 2025.", "screen": {"rubric": {"pinned_entry": false, "pinned_exit": false, "pinned_indicator_params": true, "pinned_sizing": true, "binding_coherent": true, "timeframe_coherent": false, "goal_directed": false, "external_data_required": false, "multi_asset_required": false, "hardcoded_prices_meaningful": true}, "predicted_class": "INDETERMINATE", "predicted_ambiguity_classes": ["unpinned-entry-trigger", "unpinned-exit", "timeframe-mismatch"]}, "final": {"verdict": "INDETERMINATE", "ambiguity_classes": ["unpinned-entry-trigger", "unpinned-exit", "timeframe-mismatch"], "summary": null}}, {"id": 187, "difficulty": "medium", "source": "stackexchange", "ticker": "generic", "yf_symbol": "AAPL", "timeframe": "1d", "prompt": "Strategy: Single-asset periodic rebalancing (100% weight)\n\nIdea: Manage one available asset by maintaining a constant target allocation of 100% in the asset and forcibly rebalancing the position every 12 weeks. Rebalancing is modeled as a full close and immediate re-open of the position to account for trading costs. Evaluate average performance across multiple random start dates, including commissions.\n\nData: One instrument with OHLCV. Working timeframe — weekly (resampling from daily data if needed).\n\nEntry: On the selected start date, buy the asset with 100% of the portfolio.\n\nRebalancing: Every 12 weeks, fully close the position and immediately buy again with 100% of the current portfolio value (simulating rebalancing with transaction costs).\n\nExit: At the end of 52 weeks, close the position and lock in the result.\n\nCommissions: 0.1% of the amount of each trade (buy and sell) at each rebalancing and at the final exit.\n\nTesting: Select 50 random start dates with an available 52-week forward horizon; for each date, run a separate backtest. For each run, store metrics: total return, maximum drawdown, Sharpe ratio. As the final output, report the average values of the metrics across all 50 runs.\n\nIndicators: Not required (only OHLCV and the rebalancing schedule are used).", "screen": {"rubric": {"pinned_entry": false, "pinned_exit": false, "pinned_indicator_params": true, "pinned_sizing": true, "binding_coherent": true, "timeframe_coherent": true, "goal_directed": false, "external_data_required": false, "multi_asset_required": false, "hardcoded_prices_meaningful": true}, "predicted_class": "INDETERMINATE", "predicted_ambiguity_classes": ["unpinned-entry-trigger", "unpinned-exit", "other"]}, "final": {"verdict": "INDETERMINATE", "ambiguity_classes": ["other` (Monte-Carlo evaluation protocol", "no unique single-run trace)", "unpinned-entry-trigger", "timeframe-mismatch", "unpinned-sizing"], "summary": "Single-asset (bound: AAPL 1d) periodic rebalancing: hold 100% weight, force a full close + immediate re-open every 12 weeks, exit at 52 weeks, 0.1% commission per trade. Evaluation: \"Select 50 random start dates with an available 52-week forward horizon; for each date, run a separate backtest\" and \"report the average values of the metrics across all 50 runs\" (total return, max drawdown, Sharpe)."}}, {"id": 249, "difficulty": "medium", "source": "synthetic", "ticker": "generic", "yf_symbol": "AAPL", "timefram function splitStructured(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const pieces = [];
  let section = 'Overview';
  for (const line of lines) {
    const headerMatch = line.match(/^\*\*([^*]+?):?\*\*$/);
    if (headerMatch) {
      section = headerMatch[1].trim();
      continue;
    }
    const cleaned = line
      .replace(/^(\d+\.\s*|\*\s+|-\s+)/, '')
      .replace(/\*\*/g, '')
      .trim();
    if (cleaned.length < 3) continue;
    pieces.push({ section, text: cleaned });
  }
  return pieces;
}

function splitFlat(text) {
  const pieces = [];
  text.split(/;\s+/).forEach((chunk) => {
    chunk.split(/\.\s+(?=[A-Z(])/).forEach((s) => {
      const cleaned = s.replace(/\*\*/g, '').trim().replace(/\.$/, '');
      if (cleaned.length >= 3) pieces.push({ section: 'Overview', text: cleaned });
    });
  });
  return pieces;
}

function splitIntoPieces(text) {
  const structured = splitStructured(text);
  return structured.length > 1 ? structured : splitFlat(text);
}

const deck = [];
TASKS.forEach((task, ti) => {
  const pieces = splitIntoPieces(task.prompt);
  task._pieces = pieces;
  pieces.forEach((p, pi) => deck.push({ type: 'piece', ti, pi }));
  deck.push({ type: 'recap', ti });
});

const STORE_KEY = 'qcb_prompt_review_v1';
let state = { cursor: 0, answers: {} };
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved && typeof saved.cursor === 'number') state = saved;
} catch (e) {}

function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

function answerKey(ti, pi) {
  return TASKS[ti].id + ':' + pi;
}

const mainEl = document.getElementById('main');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const jumpSelect = document.getElementById('jumpSelect');

TASKS.forEach((t, ti) => {
  const opt = document.createElement('option');
  opt.value = ti;
  opt.textContent = '#' + t.id + ' (' + t.difficulty + ', ' + t.ticker + ')';
  jumpSelect.appendChild(opt);
});
jumpSelect.addEventListener('change', () => {
  const ti = Number(jumpSelect.value);
  const idx = deck.findIndex(d => d.ti === ti);
  if (idx >= 0) { state.cursor = idx; save(); render(); }
});

function resetProgress() {
  if (confirm('Clear all progress and start over?')) {
    state = { cursor: 0, answers: {} };
    save();
    render();
  }
}
document.getElementById('resetBtn').addEventListener('click', resetProgress);
document.getElementById('exportBtn').addEventListener('click', exportJSON);

function exportJSON() {
  const rows = [];
  TASKS.forEach((t, ti) => {
    t._pieces.forEach((p, pi) => {
      const key = answerKey(ti, pi);
      const call = state.answers[key];
      if (call) {
        rows.push({
          task_id: t.id, difficulty: t.difficulty, ticker: t.ticker,
          section: p.section, piece: p.text, call
        });
      }
    });
  });
  const payload = {
    exported_at: new Date().toISOString(),
    pieces_reviewed: rows.length,
    pieces_total: deck.filter(d => d.type === 'piece').length,
    rows
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'qcb_human_review_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function verdictClass(v) {
  if (v === 'DETERMINATE') return 'det';
  if (v === 'DETERMINATE-EMPTY') return 'emp';
  if (v === 'REFERENCE-PRODUCTION-FAILED') return 'fail';
  return 'ind';
}

function render() {
  const total = deck.filter(d => d.type === 'piece').length;
  const answered = Object.keys(state.answers).length;
  progressFill.style.width = Math.round(100 * Math.min(state.cursor, deck.length) / deck.length) + '%';

  if (state.cursor >= deck.length) {
    renderFinale();
    return;
  }

  const entry = deck[state.cursor];
  jumpSelect.value = String(entry.ti);
  const task = TASKS[entry.ti];

  if (entry.type === 'recap') {
    progressLabel.textContent = 'Task ' + (entry.ti + 1) + ' of ' + TASKS.length + ' · recap';
    renderRecap(entry.ti);
    return;
  }

  const piece = task._pieces[entry.pi];
  progressLabel.textContent = 'Task ' + (entry.ti + 1) + '/' + TASKS.length +
    ' · piece ' + (entry.pi + 1) + '/' + task._pieces.length +
    ' · ' + answered + '/' + total + ' answered';
  renderPieceCard(task, piece, entry);
}

function renderPieceCard(task, piece, entry) {
  mainEl.innerHTML = '';
  const stage = document.createElement('div');
  stage.className = 'stage';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML =
    '<div class="meta">' +
      '<span class="badge">#' + task.id + '</span>' +
      '<span class="badge">' + task.difficulty + '</span>' +
      '<span class="badge">' + task.ticker + ' @ ' + task.timeframe + '</span>' +
    '</div>' +
    '<div class="section-label">' + piece.section + '</div>' +
    '<div class="piece-text"></div>' +
    '<details class="full-prompt"><summary>Full prompt</summary><pre></pre></details>' +
    '<div class="stamp pin">PINNED</div>' +
    '<div class="stamp amb">AMBIGUOUS</div>';
  card.querySelector('.piece-text').textContent = piece.text;
  card.querySelector('.full-prompt pre').textContent = task.prompt;
  stage.appendChild(card);
  mainEl.appendChild(stage);

  const controls = document.createElement('div');
  controls.className = 'controls';
  controls.innerHTML =
    '<button class="round-btn amb" title="Ambiguous (Left arrow)">&#10005;</button>' +
    '<button class="round-btn pin" title="Pinned (Right arrow)">&#10003;</button>';
  stage.after(controls);

  const stampPin = card.querySelector('.stamp.pin');
  const stampAmb = card.querySelector('.stamp.amb');

  let dragging = false, startX = 0, dx = 0;

  function setTransform(x) {
    card.style.transform = 'translateX(' + x + 'px) rotate(' + (x / 20) + 'deg)';
    stampPin.style.opacity = Math.max(0, Math.min(1, x / 100));
    stampAmb.style.opacity = Math.max(0, Math.min(1, -x / 100));
  }

  function commit(call) {
    state.answers[answerKey(entry.ti, entry.pi)] = call;
    const flyX = call === 'pinned' ? 900 : -900;
    card.style.transition = 'transform .25s ease-out';
    setTransform(flyX);
    setTimeout(() => {
      state.cursor += 1;
      save();
      render();
    }, 180);
  }

  card.addEventListener('pointerdown', (e) => {
    dragging = true; startX = e.clientX; card.style.transition = 'none';
    card.setPointerCapture(e.pointerId);
  });
  card.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    dx = e.clientX - startX;
    setTransform(dx);
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    card.style.transition = 'transform .2s ease-out';
    if (Math.abs(dx) > 110) {
      commit(dx > 0 ? 'pinned' : 'ambiguous');
    } else {
      setTransform(0);
    }
    dx = 0;
  }
  card.addEventListener('pointerup', endDrag);
  card.addEventListener('pointercancel', endDrag);

  controls.children[0].addEventListener('click', () => commit('ambiguous'));
  controls.children[1].addEventListener('click', () => commit('pinned'));
}

function renderRecap(ti) {
  const task = TASKS[ti];
  mainEl.innerHTML = '';
  const pieces = task._pieces;
  let ambCount = 0;
  pieces.forEach((p, pi) => {
    if (state.answers[answerKey(ti, pi)] === 'ambiguous') ambCount++;
  });

  const screen = task.screen || {};
  const final = task.final || {};
  const yourCall = ambCount > 0 ? 'AMBIGUOUS' : 'CLEAR';
  const finalIsIndeterminate = final.verdict === 'INDETERMINATE' || final.verdict === 'REFERENCE-PRODUCTION-FAILED';
  const agree = (ambCount > 0) === finalIsIndeterminate;

  const box = document.createElement('div');
  box.className = 'recap';
  box.innerHTML =
    '<h2>Task #' + task.id + ' recap</h2>' +
    '<div class="summary-text"></div>' +
    '<div class="verdict-row"><strong>Your read:</strong>&nbsp;' + yourCall +
      ' (' + ambCount + ' of ' + pieces.length + ' pieces flagged)</div>' +
    '<div class="verdict-row"><strong>AI static screen</strong>&nbsp;(advisory only, per REPORT.md):' +
      '<span class="verdict-chip ' + verdictClass(screen.predicted_class) + '">' + (screen.predicted_class || 'n/a') + '</span></div>' +
    '<div class="summary-text">classes: ' + ((screen.predicted_ambiguity_classes || []).join(', ') || 'none') + '</div>' +
    '<div class="verdict-row"><strong>Final verdict</strong>&nbsp;(3x independent implementation convergence):' +
      '<span class="verdict-chip ' + verdictClass(final.verdict) + '">' + final.verdict + '</span></div>' +
    '<div class="summary-text">classes: ' + ((final.ambiguity_classes || []).join(', ') || 'none') + '</div>' +
    '<div class="agree ' + (agree ? 'yes' : 'no') + '">' + (agree ? 'Your read matches the final verdict.' : 'Your read differs from the final verdict.') + '</div>' +
    '<div class="controls"><button class="primary" id="continueBtn">Continue &#8594;</button></div>';
  box.querySelector('.summary-text').textContent = final.summary || '';
  mainEl.appendChild(box);
  document.getElementById('continueBtn').addEventListener('click', () => {
    state.cursor += 1; save(); render();
  });
}

function renderFinale() {
  mainEl.innerHTML = '';
  const total = deck.filter(d => d.type === 'piece').length;
  let ambTotal = 0;
  Object.values(state.answers).forEach(v => { if (v === 'ambiguous') ambTotal++; });

  let agreeCount = 0;
  TASKS.forEach((task, ti) => {
    let amb = 0;
    task._pieces.forEach((p, pi) => {
      if (state.answers[answerKey(ti, pi)] === 'ambiguous') amb++;
    });
    const finalIsIndeterminate = task.final.verdict === 'INDETERMINATE' || task.final.verdict === 'REFERENCE-PRODUCTION-FAILED';
    if ((amb > 0) === finalIsIndeterminate) agreeCount++;
  });

  const box = document.createElement('div');
  box.className = 'finale';
  box.innerHTML =
    '<h2>Review complete</h2>' +
    '<div class="summary-text">' + total + ' pieces reviewed across ' + TASKS.length + ' tasks.<br>' +
    'You flagged ' + ambTotal + ' pieces as ambiguous (' + Math.round(100 * ambTotal / Math.max(1, total)) + '%).<br>' +
    'Your task-level read agreed with the final empirical verdict on ' + agreeCount + '/' + TASKS.length + ' tasks.</div>' +
    '<div class="controls">' +
      '<button class="primary" id="exportBtn2">Export JSON</button>' +
      '<button id="resetBtn2">Start over</button>' +
    '</div>';
  mainEl.appendChild(box);
  document.getElementById('exportBtn2').addEventListener('click', exportJSON);
  document.getElementById('resetBtn2').addEventListener('click', resetProgress);
}

    if (btn) btn.click();
  }
});

render();
</script>
