<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>QCB Prompt Piece Review</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1b1f24;
    --muted: #6b7280;
    --border: #e2e4e8;
    --green: #1f8a4c;
    --green-bg: #e6f6ec;
    --red: #c0392b;
    --red-bg: #fbe9e7;
    --accent: #1d4ed8;
    --amber: #b7791f;
    --amber-bg: #fdf3e0;
    --gray-bg: #eceef1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --card: #1e2126;
      --text: #eef0f2;
      --muted: #9aa1ab;
      --border: #2b2f36;
      --green: #4fbf7a;
      --green-bg: #163625;
      --red: #e2685c;
      --red-bg: #3a1f1c;
      --accent: #6d93ff;
      --amber: #e0b04f;
      --amber-bg: #3a2f16;
      --gray-bg: #262a30;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  body { display: flex; flex-direction: column; min-height: 100vh; }
  header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; white-space: nowrap; }
  .progress-wrap { flex: 1 1 200px; min-width: 160px; }
  .progress-bar { height: 8px; border-radius: 4px; background: var(--gray-bg); overflow: hidden; }
  .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width .2s; }
  .progress-label { font-size: 13px; color: var(--muted); margin-top: 4px; }
  select, button {
    font: inherit; font-size: 14px; padding: 8px 12px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    cursor: pointer;
  }
  button.primary { background: var(--accent); color: white; border-color: var(--accent); }
  main {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 24px 16px 8px;
  }
  .stage { position: relative; width: min(520px, 92vw); height: min(560px, 70vh); }
  .card {
    position: absolute; inset: 0; background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,.15);
    padding: 26px; display: flex; flex-direction: column; gap: 14px;
    touch-action: none; user-select: none; will-change: transform;
  }
  .card .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
  .badge { padding: 3px 9px; border-radius: 999px; background: var(--gray-bg); }
  .section-label { font-size: 15px; font-weight: 600; color: var(--accent); }
  .piece-text { font-size: 26px; line-height: 1.35; flex: 1; overflow-y: auto; }
  .stamp {
    position: absolute; top: 28px; padding: 6px 14px; border: 3px solid; border-radius: 10px;
    font-size: 22px; font-weight: 800; letter-spacing: 1px; opacity: 0; pointer-events: none;
  }
  .stamp.pin { left: 24px; color: var(--green); border-color: var(--green); transform: rotate(-12deg); }
  .stamp.amb { right: 24px; color: var(--red); border-color: var(--red); transform: rotate(12deg); }
  details.full-prompt { font-size: 13px; color: var(--muted); }
  details.full-prompt pre {
    white-space: pre-wrap; font-family: inherit; font-size: 13px; max-height: 160px; overflow-y: auto;
  }
  .controls { display: flex; justify-content: center; gap: 20px; padding: 10px 0 20px; }
  .round-btn {
    width: 62px; height: 62px; border-radius: 50%; font-size: 26px;
    border: 2px solid var(--border); background: var(--card); color: var(--text); cursor: pointer;
  }
  .round-btn.amb { color: var(--red); border-color: var(--red); }
  .round-btn.pin { color: var(--green); border-color: var(--green); }
  .hint { text-align: center; color: var(--muted); font-size: 13px; padding-bottom: 18px; }
  .recap, .finale {
    background: var(--card); border: 1px solid var(--border); border-radius: 20px;
    padding: 30px; width: min(560px, 92vw); max-height: 80vh; overflow-y: auto;
  }
  .recap h2, .finale h2 { margin-top: 0; }
  .verdict-row { display: flex; align-items: center; gap: 10px; margin: 14px 0; flex-wrap: wrap; }
  .verdict-chip { padding: 5px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; }
  .verdict-chip.det { background: var(--green-bg); color: var(--green); }
  .verdict-chip.ind { background: var(--red-bg); color: var(--red); }
  .verdict-chip.emp { background: var(--amber-bg); color: var(--amber); }
  .verdict-chip.fail { background: var(--gray-bg); color: var(--muted); }
  .agree { font-size: 14px; margin-top: 4px; }
  .agree.yes { color: var(--green); }
  .agree.no { color: var(--red); }
  .summary-text { font-size: 15px; color: var(--muted); line-height: 1.5; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 6px 0 14px; }
</style>
</head>
<body>
<header>
  <h1>QCB Prompt Piece Review</h1>
  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-label" id="progressLabel"></div>
  </div>
  <select id="jumpSelect"></select>
  <button id="exportBtn">Export JSON</button>
  <button id="resetBtn">Start over</button>
</header>
<main id="main"></main>
<footer>Left = ambiguous, unpinned. Right = pinned, clear. Arrow keys work too. Progress saves automatically in this browser.</footer>
<script>
const TASKS = __TASKS_JSON__;

function splitStructured(text) {
  const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const pieces = [];
  let section = 'Overview';
  for (const line of lines) {
    const headerMatch = line.match(/^\*\*([^*]+?):?\*\*$/);
    if (headerMatch) {
      section = headerMatch[1].trim();
      continue;
    }
    const cleaned = line
      .replace(/^(\d+\.\s*|\*\s+|-\s+)/, '')
      .replace(/\*\*/g, '')
      .trim();
    if (cleaned.length < 3) continue;
    pieces.push({ section, text: cleaned });
  }
  return pieces;
}

function splitFlat(text) {
  const pieces = [];
  text.split(/;\s+/).forEach((chunk) => {
    chunk.split(/\.\s+(?=[A-Z(])/).forEach((s) => {
      const cleaned = s.replace(/\*\*/g, '').trim().replace(/\.$/, '');
      if (cleaned.length >= 3) pieces.push({ section: 'Overview', text: cleaned });
    });
  });
  return pieces;
}

function splitIntoPieces(text) {
  const structured = splitStructured(text);
  return structured.length > 1 ? structured : splitFlat(text);
}

const deck = [];
TASKS.forEach((task, ti) => {
  const pieces = splitIntoPieces(task.prompt);
  task._pieces = pieces;
  pieces.forEach((p, pi) => deck.push({ type: 'piece', ti, pi }));
  deck.push({ type: 'recap', ti });
});

const STORE_KEY = 'qcb_prompt_review_v1';
let state = { cursor: 0, answers: {} };
try {
  const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
  if (saved && typeof saved.cursor === 'number') state = saved;
} catch (e) {}

function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

function answerKey(ti, pi) {
  return TASKS[ti].id + ':' + pi;
}

const mainEl = document.getElementById('main');
const progressFill = document.getElementById('progressFill');
const progressLabel = document.getElementById('progressLabel');
const jumpSelect = document.getElementById('jumpSelect');

TASKS.forEach((t, ti) => {
  const opt = document.createElement('option');
  opt.value = ti;
  opt.textContent = '#' + t.id + ' (' + t.difficulty + ', ' + t.ticker + ')';
  jumpSelect.appendChild(opt);
});
jumpSelect.addEventListener('change', () => {
  const ti = Number(jumpSelect.value);
  const idx = deck.findIndex(d => d.ti === ti);
  if (idx >= 0) { state.cursor = idx; save(); render(); }
});

function resetProgress() {
  if (confirm('Clear all progress and start over?')) {
    state = { cursor: 0, answers: {} };
    save();
    render();
  }
}
document.getElementById('resetBtn').addEventListener('click', resetProgress);
document.getElementById('exportBtn').addEventListener('click', exportJSON);

function exportJSON() {
  const rows = [];
  TASKS.forEach((t, ti) => {
    t._pieces.forEach((p, pi) => {
      const key = answerKey(ti, pi);
      const call = state.answers[key];
      if (call) {
        rows.push({
          task_id: t.id, difficulty: t.difficulty, ticker: t.ticker,
          section: p.section, piece: p.text, call
        });
      }
    });
  });
  const payload = {
    exported_at: new Date().toISOString(),
    pieces_reviewed: rows.length,
    pieces_total: deck.filter(d => d.type === 'piece').length,
    rows
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'qcb_human_review_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
}

function verdictClass(v) {
  if (v === 'DETERMINATE') return 'det';
  if (v === 'DETERMINATE-EMPTY') return 'emp';
  if (v === 'REFERENCE-PRODUCTION-FAILED') return 'fail';
  return 'ind';
}

function render() {
  const total = deck.filter(d => d.type === 'piece').length;
  const answered = Object.keys(state.answers).length;
  progressFill.style.width = Math.round(100 * Math.min(state.cursor, deck.length) / deck.length) + '%';

  if (state.cursor >= deck.length) {
    renderFinale();
    return;
  }

  const entry = deck[state.cursor];
  jumpSelect.value = String(entry.ti);
  const task = TASKS[entry.ti];

  if (entry.type === 'recap') {
    progressLabel.textContent = 'Task ' + (entry.ti + 1) + ' of ' + TASKS.length + ' · recap';
    renderRecap(entry.ti);
    return;
  }

  const piece = task._pieces[entry.pi];
  progressLabel.textContent = 'Task ' + (entry.ti + 1) + '/' + TASKS.length +
    ' · piece ' + (entry.pi + 1) + '/' + task._pieces.length +
    ' · ' + answered + '/' + total + ' answered';
  renderPieceCard(task, piece, entry);
}

function renderPieceCard(task, piece, entry) {
  mainEl.innerHTML = '';
  const stage = document.createElement('div');
  stage.className = 'stage';

  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML =
    '<div class="meta">' +
      '<span class="badge">#' + task.id + '</span>' +
      '<span class="badge">' + task.difficulty + '</span>' +
      '<span class="badge">' + task.ticker + ' @ ' + task.timeframe + '</span>' +
    '</div>' +
    '<div class="section-label">' + piece.section + '</div>' +
    '<div class="piece-text"></div>' +
    '<details class="full-prompt"><summary>Full prompt</summary><pre></pre></details>' +
    '<div class="stamp pin">PINNED</div>' +
    '<div class="stamp amb">AMBIGUOUS</div>';
  card.querySelector('.piece-text').textContent = piece.text;
  card.querySelector('.full-prompt pre').textContent = task.prompt;
  stage.appendChild(card);
  mainEl.appendChild(stage);

  const controls = document.createElement('div');
  controls.className = 'controls';
  controls.innerHTML =
    '<button class="round-btn amb" title="Ambiguous (Left arrow)">&#10005;</button>' +
    '<button class="round-btn pin" title="Pinned (Right arrow)">&#10003;</button>';
  stage.after(controls);

  const stampPin = card.querySelector('.stamp.pin');
  const stampAmb = card.querySelector('.stamp.amb');

  let dragging = false, startX = 0, dx = 0;

  function setTransform(x) {
    card.style.transform = 'translateX(' + x + 'px) rotate(' + (x / 20) + 'deg)';
    stampPin.style.opacity = Math.max(0, Math.min(1, x / 100));
    stampAmb.style.opacity = Math.max(0, Math.min(1, -x / 100));
  }

  function commit(call) {
    state.answers[answerKey(entry.ti, entry.pi)] = call;
    const flyX = call === 'pinned' ? 900 : -900;
    card.style.transition = 'transform .25s ease-out';
    setTransform(flyX);
    setTimeout(() => {
      state.cursor += 1;
      save();
      render();
    }, 180);
  }

  card.addEventListener('pointerdown', (e) => {
    dragging = true; startX = e.clientX; card.style.transition = 'none';
    card.setPointerCapture(e.pointerId);
  });
  card.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    dx = e.clientX - startX;
    setTransform(dx);
  });
  function endDrag() {
    if (!dragging) return;
    dragging = false;
    card.style.transition = 'transform .2s ease-out';
    if (Math.abs(dx) > 110) {
      commit(dx > 0 ? 'pinned' : 'ambiguous');
    } else {
      setTransform(0);
    }
    dx = 0;
  }
  card.addEventListener('pointerup', endDrag);
  card.addEventListener('pointercancel', endDrag);

  controls.children[0].addEventListener('click', () => commit('ambiguous'));
  controls.children[1].addEventListener('click', () => commit('pinned'));
}

function renderRecap(ti) {
  const task = TASKS[ti];
  mainEl.innerHTML = '';
  const pieces = task._pieces;
  let ambCount = 0;
  pieces.forEach((p, pi) => {
    if (state.answers[answerKey(ti, pi)] === 'ambiguous') ambCount++;
  });

  const screen = task.screen || {};
  const final = task.final || {};
  const yourCall = ambCount > 0 ? 'AMBIGUOUS' : 'CLEAR';
  const finalIsIndeterminate = final.verdict === 'INDETERMINATE' || final.verdict === 'REFERENCE-PRODUCTION-FAILED';
  const agree = (ambCount > 0) === finalIsIndeterminate;

  const box = document.createElement('div');
  box.className = 'recap';
  box.innerHTML =
    '<h2>Task #' + task.id + ' recap</h2>' +
    '<div class="summary-text"></div>' +
    '<div class="verdict-row"><strong>Your read:</strong>&nbsp;' + yourCall +
      ' (' + ambCount + ' of ' + pieces.length + ' pieces flagged)</div>' +
    '<div class="verdict-row"><strong>AI static screen</strong>&nbsp;(advisory only, per REPORT.md):' +
      '<span class="verdict-chip ' + verdictClass(screen.predicted_class) + '">' + (screen.predicted_class || 'n/a') + '</span></div>' +
    '<div class="summary-text">classes: ' + ((screen.predicted_ambiguity_classes || []).join(', ') || 'none') + '</div>' +
    '<div class="verdict-row"><strong>Final verdict</strong>&nbsp;(3x independent implementation convergence):' +
      '<span class="verdict-chip ' + verdictClass(final.verdict) + '">' + final.verdict + '</span></div>' +
    '<div class="summary-text">classes: ' + ((final.ambiguity_classes || []).join(', ') || 'none') + '</div>' +
    '<div class="agree ' + (agree ? 'yes' : 'no') + '">' + (agree ? 'Your read matches the final verdict.' : 'Your read differs from the final verdict.') + '</div>' +
    '<div class="controls"><button class="primary" id="continueBtn">Continue &#8594;</button></div>';
  box.querySelector('.summary-text').textContent = final.summary || '';
  mainEl.appendChild(box);
  document.getElementById('continueBtn').addEventListener('click', () => {
    state.cursor += 1; save(); render();
  });
}

function renderFinale() {
  mainEl.innerHTML = '';
  const total = deck.filter(d => d.type === 'piece').length;
  let ambTotal = 0;
  Object.values(state.answers).forEach(v => { if (v === 'ambiguous') ambTotal++; });

  let agreeCount = 0;
  TASKS.forEach((task, ti) => {
    let amb = 0;
    task._pieces.forEach((p, pi) => {
      if (state.answers[answerKey(ti, pi)] === 'ambiguous') amb++;
    });
    const finalIsIndeterminate = task.final.verdict === 'INDETERMINATE' || task.final.verdict === 'REFERENCE-PRODUCTION-FAILED';
    if ((amb > 0) === finalIsIndeterminate) agreeCount++;
  });

  const box = document.createElement('div');
  box.className = 'finale';
  box.innerHTML =
    '<h2>Review complete</h2>' +
    '<div class="summary-text">' + total + ' pieces reviewed across ' + TASKS.length + ' tasks.<br>' +
    'You flagged ' + ambTotal + ' pieces as ambiguous (' + Math.round(100 * ambTotal / Math.max(1, total)) + '%).<br>' +
    'Your task-level read agreed with the final empirical verdict on ' + agreeCount + '/' + TASKS.length + ' tasks.</div>' +
    '<div class="controls">' +
      '<button class="primary" id="exportBtn2">Export JSON</button>' +
      '<button id="resetBtn2">Start over</button>' +
    '</div>';
  mainEl.appendChild(box);
  document.getElementById('exportBtn2').addEventListener('click', exportJSON);
  document.getElementById('resetBtn2').addEventListener('click', resetProgress);
}

document.addEventListener('keydown', (e) => {
  if (state.cursor >= deck.length) return;
  const entry = deck[state.cursor];
  if (entry.type === 'recap') {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') {
      state.cursor += 1; save(); render();
    }
    return;
  }
  if (e.key === 'ArrowRight') {
    const btn = document.querySelector('.round-btn.pin');
    if (btn) btn.click();
  } else if (e.key === 'ArrowLeft') {
    const btn = document.querySelector('.round-btn.amb');
    if (btn) btn.click();
  }
});

render();
</script>
</body>
</html>
